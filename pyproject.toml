[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Latency arbitrage bot for Polymarket BTC/ETH 5m/15m up/down contracts"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "textual>=0.50.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
polybot = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
